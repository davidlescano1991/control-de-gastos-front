name: 3. Deploy a Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy a Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de repo privado
        uses: actions/checkout@v4

      - name: Descargar artefacto compilado previo (generado por Build en develop)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download --name dist-control-gastos-front --dir dist/control-gastos-front/browser || echo "No se encontró artefacto remoto, ejecutando fallback..."

      - name: Fallback Build (solo si no existía el artefacto previo)
        if: hashFiles('dist/control-gastos-front/browser/index.html') == ''
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile
          sed -i "s/__APP_VERSION_VALUE__/V1.0.${{ github.run_number }}/g" src/index.html
          pnpm exec -- ng build --configuration production --base-href "/"

      - name: Deploy a Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CONTROL_GASTOS }}
          projectId: control-gastos-472318
          target: control-gastos-dml
          channelId: live
