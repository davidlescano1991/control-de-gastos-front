name: Build and Deploy proyecto Angular

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout de repo privado
        uses: actions/checkout@v3

      - name: Setup Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Enable corepack and setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Instalacion de dependencias (pnpm)
        run: pnpm install --frozen-lockfile

      - name: Verificar pnpm antes de auditoría (pre-audit)
        run: pnpm -v

      - name: Ejecutar auditoría de dependencias
        run: pnpm audit --audit-level=moderate || true

      - name: Inyectar version de despliegue
        run: sed -i "s/__APP_VERSION_VALUE__/V1.0.${{ github.run_number }}/g" src/index.html

      - name: Build proyecto Angular
        run: pnpm exec -- ng build --configuration production --base-href "/control-de-gastos-dml-pages/"

      - name: Deploy en el repositorio publico
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: davidlescano1991/control-de-gastos-dml-pages
          publish_branch: gh-pages
          publish_dir: dist/control-gastos-front/browser
