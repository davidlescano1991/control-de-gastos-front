<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 42" width="160" height="42" fill="none">
  <defs>
    <!-- Acero Inoxidable DMC-12 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="35%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="hoodHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.1" />
    </linearGradient>
    <!-- Cabina y Vidrios -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
    </linearGradient>
    <!-- Reactor / Turbinas -->
    <linearGradient id="reactorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <!-- Neón Cilindros Azules -->
    <linearGradient id="canisterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc" />
      <stop offset="50%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- === EQUIPAMIENTO TRASERO BTTF (TUNE) === -->
  <!-- Rejillas de ventilación traseras anguladas -->
  <polygon points="126,2 142,2 148,15 132,15" fill="url(#reactorGrad)" stroke="#0f172a" stroke-width="1.2" />
  <line x1="130" y1="5" x2="143" y2="5" stroke="#64748b" stroke-width="1" />
  <line x1="133" y1="9" x2="145" y2="9" stroke="#64748b" stroke-width="1" />
  <line x1="135" y1="12" x2="147" y2="12" stroke="#64748b" stroke-width="1" />

  <!-- Bloque reactor Mr. Fusion / BTTF Box -->
  <rect x="108" y="7" width="22" height="11" rx="1" fill="#334155" stroke="#0f172a" stroke-width="1.2" />
  <rect x="111" y="9" width="6" height="5" rx="0.5" fill="#e2e8f0" stroke="#475569" stroke-width="0.8" />

  <!-- 3 Cilindros de condensación de flujo neón azul -->
  <rect x="119" y="10" width="3.5" height="7" rx="1" fill="url(#canisterGrad)" filter="url(#neonGlow)" />
  <rect x="123.5" y="10" width="3.5" height="7" rx="1" fill="url(#canisterGrad)" filter="url(#neonGlow)" />
  <rect x="128" y="10" width="3.5" height="7" rx="1" fill="url(#canisterGrad)" filter="url(#neonGlow)" />

  <!-- === CARROCERÍA PRINCIPAL DMC-12 === -->
  <!-- Base de acero inoxidable -->
  <path d="M 6,26 L 18,21 L 52,11 L 102,11 L 120,20 L 148,22 L 152,26 L 152,33 L 144,33 L 138,28 L 106,28 L 100,33 L 56,33 L 50,28 L 22,28 L 16,33 L 4,33 L 4,28 Z"
        fill="url(#bodyGrad)" stroke="#1e293b" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Brillo superior biselado del capó -->
  <polygon points="19,21.5 52,12 101,12 119,20.5 101,14 53,14" fill="url(#hoodHighlight)" />

  <!-- Franja moldura lateral negra icónica DeLorean -->
  <path d="M 6,24.5 L 150,24.5" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" />
  <line x1="8" y1="24.5" x2="16" y2="24.5" stroke="#f59e0b" stroke-width="1.8" /> <!-- Giro lateral naranja delantero -->

  <!-- Cabina y Ventanas tintadas -->
  <polygon points="56,12.5 100,12.5 114,20 52,20" fill="url(#glassGrad)" stroke="#0f172a" stroke-width="1" />
  <polygon points="58,13.5 78,13.5 73,19 54,19" fill="#38bdf8" opacity="0.65" />
  <polygon points="80,13.5 98,13.5 110,19 76,19" fill="#0f172a" opacity="0.85" />
  <line x1="78" y1="12.5" x2="74" y2="20" stroke="#64748b" stroke-width="1.5" /> <!-- Pilar de puerta ala de gaviota -->

  <!-- Cableado / Mangueras temporales exteriores (BTTF wiring) -->
  <path d="M 106,28 C 106,20 138,20 138,28" fill="none" stroke="#e2e8f0" stroke-width="1.8" stroke-dasharray="2.5,1.5" />
  <path d="M 28,27.5 L 98,27.5" fill="none" stroke="#00f2ff" stroke-width="1.2" stroke-dasharray="3,1.5" filter="url(#neonGlow)" />

  <!-- Ópticas traseras y paragolpes -->
  <rect x="149" y="23" width="2.5" height="4" fill="#ef4444" />
  <rect x="149" y="27" width="2.5" height="2" fill="#f59e0b" />
  <rect x="150" y="29.5" width="3" height="3.5" fill="#0f172a" rx="0.5" />

  <!-- Paragolpes delantero negro -->
  <rect x="3" y="26" width="4" height="6" fill="#0f172a" rx="0.5" />
  <rect x="4" y="26.5" width="2" height="2.5" fill="#f59e0b" />

  <!-- === RUEDAS TURBINA DEPORTIVAS HD === -->
  <!-- Rueda delantera -->
  <g transform="translate(36, 30.5)">
    <circle cx="0" cy="0" r="9.5" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="0" cy="0" r="6.5" fill="#94a3b8" />
    <circle cx="0" cy="0" r="3" fill="#0f172a" />
    <circle cx="0" cy="0" r="1.5" fill="#f1f5f9" />
    <!-- Rayos de turbina finos -->
    <line x1="0" y1="-6.5" x2="0" y2="6.5" stroke="#f8fafc" stroke-width="1" />
    <line x1="-6.5" y1="0" x2="6.5" y2="0" stroke="#f8fafc" stroke-width="1" />
    <line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5" stroke="#f8fafc" stroke-width="1" />
    <line x1="-4.5" y1="4.5" x2="4.5" y2="-4.5" stroke="#f8fafc" stroke-width="1" />
  </g>

  <!-- Rueda trasera -->
  <g transform="translate(122, 30.5)">
    <circle cx="0" cy="0" r="9.5" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="0" cy="0" r="6.5" fill="#94a3b8" />
    <circle cx="0" cy="0" r="3" fill="#0f172a" />
    <circle cx="0" cy="0" r="1.5" fill="#f1f5f9" />
    <!-- Rayos de turbina finos -->
    <line x1="0" y1="-6.5" x2="0" y2="6.5" stroke="#f8fafc" stroke-width="1" />
    <line x1="-6.5" y1="0" x2="6.5" y2="0" stroke="#f8fafc" stroke-width="1" />
    <line x1="-4.5" y1="-4.5" x2="4.5" y2="4.5" stroke="#f8fafc" stroke-width="1" />
    <line x1="-4.5" y1="4.5" x2="4.5" y2="-4.5" stroke="#f8fafc" stroke-width="1" />
  </g>
</svg>
