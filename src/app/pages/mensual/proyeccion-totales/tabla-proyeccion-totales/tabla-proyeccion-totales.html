<mat-card class="tabla-resumen-card" appearance="outlined" [class.is-collapsed]="isCollapsed()">
  <mat-card-header class="card-header-wrapper">
    <mat-card-title>Proyección de Totales Futuros</mat-card-title>
    <button type="button" class="btn-collapse-card" [class.collapsed]="isCollapsed()" (click)="toggleCollapse()"
      [title]="isCollapsed() ? 'Expandir Proyección' : 'Contraer Proyección'">
      <svg class="icon-triangle" viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z" />
      </svg>
    </button>
  </mat-card-header>

  <ng-container *ngIf="!isCollapsed()">

    <mat-card-content>
      <div class="spinner" *ngIf="isCargando(); else tabla">
        <mat-spinner diameter="40"></mat-spinner>
      </div>

      <ng-template #tabla>
        <table class="tabla-movimientos" *ngIf="filasProyeccion().length > 0">
          <thead>
            <tr class="header-excel">
              <th class="th-mes">Mes</th>
              <th class="th-subtotal">Subtotal</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let row of filasProyeccion()" [ngClass]="row.estadoMes"
              [class.fila-mes-actual]="row.estadoMes === 'mes-actual'">
              <td class="td-mes">
                <div class="td-mes-content">
                  <span class="mes-label">{{ row.mes }}</span>
                  <span *ngIf="row.estadoMes === 'mes-actual'" class="tag-actual">Actual</span>
                </div>
              </td>
              <td class="td-monto">
                {{ row.subtotal | currency:'ARS':'symbol':'1.2-2':'es-AR' }}
              </td>
            </tr>
          </tbody>
        </table>
        <div *ngIf="filasProyeccion().length === 0" class="sin-datos-msg">
          Sin proyección disponible para este mes
        </div>
      </ng-template>
    </mat-card-content>
  </ng-container>
</mat-card>
