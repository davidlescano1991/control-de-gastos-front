<div class="movimientos-wrapper" [class.is-collapsed]="isCollapsed()">
  <div class="card-header-wrapper">
    <div class="header-title-box">
      <div class="title-row">
        <h3>Gráfico Histórico Estimativo</h3>
      </div>

      <div class="header-controls-row" *ngIf="!isCollapsed()">
        <!-- Selector de Series tipo Píldora (igual a Gráfico Estimativo) -->
        <div class="tabs-serie-selector">
          <button
            type="button"
            class="btn-serie-tab"
            [class.active]="serieActiva() === 'todas'"
            (click)="cambiarSerie('todas')"
            title="Ver todas las curvas: Saldos y Deudas"
          >
            <mat-icon>stacked_line_chart</mat-icon>
            <span>General</span>
          </button>
          <button
            type="button"
            class="btn-serie-tab"
            [class.active]="serieActiva() === 'saldos'"
            (click)="cambiarSerie('saldos')"
            title="Evolución histórica de Saldo Real vs Saldo Estimado"
          >
            <mat-icon>account_balance_wallet</mat-icon>
            <span>Saldos</span>
          </button>
          <button
            type="button"
            class="btn-serie-tab"
            [class.active]="serieActiva() === 'deudas'"
            (click)="cambiarSerie('deudas')"
            title="Evolución histórica de Deuda Real vs Deuda Estimada"
          >
            <mat-icon>trending_down</mat-icon>
            <span>Deudas</span>
          </button>
        </div>

        <!-- Selector de Moneda: Pesos vs Dólares -->
        <div class="tabs-serie-selector">
          <button
            type="button"
            class="btn-serie-tab"
            [class.active]="monedaActiva() === 'ARS'"
            (click)="cambiarMoneda('ARS')"
            title="Visualizar valores históricos en Pesos (ARS)"
          >
            <mat-icon>attach_money</mat-icon>
            <span>Pesos ($)</span>
          </button>
          <button
            type="button"
            class="btn-serie-tab"
            [class.active]="monedaActiva() === 'USD'"
            (click)="cambiarMoneda('USD')"
            title="Visualizar valores históricos convertidos a Dólares (USD)"
          >
            <mat-icon>currency_exchange</mat-icon>
            <span>Dólares (US$)</span>
          </button>
        </div>
      </div>
    </div>

    <button
      type="button"
      class="btn-collapse-card"
      [class.collapsed]="isCollapsed()"
      (click)="toggleCollapse()"
      [title]="isCollapsed() ? 'Expandir Gráfico Histórico' : 'Contraer Gráfico Histórico'"
    >
      <svg class="icon-triangle" viewBox="0 0 24 24" width="20" height="20">
        <path fill="currentColor" d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z" />
      </svg>
    </button>
  </div>

  <ng-container *ngIf="!isCollapsed()">
    <div class="spinner-box" *ngIf="isCargando; else grafico">
      <mat-spinner diameter="40"></mat-spinner>
    </div>
    <ng-template #grafico>
      <div class="grafico-wrapper">
        <canvas baseChart [data]="chartData" [options]="chartOptions" [plugins]="chartPlugins" [type]="'line'"></canvas>
      </div>
    </ng-template>
  </ng-container>
</div>
